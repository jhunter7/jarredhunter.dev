server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind TLS-terminating ingress: use relative redirects so clients
    # stay on https (default nginx sends http:// in Location headers).
    absolute_redirect off;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
