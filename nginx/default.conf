server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    # Traefik terminates TLS and forwards plain HTTP. Never issue a 301 here —
    # clients would follow Location: http://… and hit Traefik's web entrypoint,
    # which is not routing this host (plain-text 404). Rewrite internally instead.
    location / {
        rewrite ^/(.+[^/])$ /$1/ break;
        try_files $uri $uri/index.html =404;
    }
}
