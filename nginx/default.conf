server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    # Traefik terminates TLS and forwards plain HTTP. Prefer index.html lookup
    # before $uri so /blog (no slash) serves /blog/index.html instead of 301ing
    # to http://jarredhunter.dev/blog/ — Traefik's web entrypoint 404s on HTTP.
    location / {
        try_files $uri/index.html $uri =404;
    }
}
