server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    port_in_redirect off;

    # Static assets — extension match takes precedence over location /
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?|xml|txt)$ {
        try_files $uri =404;
    }

    # Traefik terminates TLS and forwards plain HTTP. Rewrite missing slashes
    # before try_files; nginx otherwise 301s to http://jarredhunter.dev/blog/.
    rewrite ^/(.+[^/])$ /$1/ last;

    location / {
        try_files $uri/index.html =404;
    }
}
