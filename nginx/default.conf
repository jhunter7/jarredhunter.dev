server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    # Ingress terminates TLS and forwards plain HTTP to the pod. Never send
    # clients an absolute http:// redirect — rewrite missing trailing slashes
    # internally instead of issuing a 301.
    rewrite ^/(.*[^/])$ /$1/ last;

    location / {
        try_files $uri $uri/index.html =404;
    }
}
