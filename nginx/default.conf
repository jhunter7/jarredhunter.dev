server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    port_in_redirect off;

    # Traefik terminates TLS and forwards plain HTTP. Do not use `index` here —
    # it 301s directory paths (/blog) to http://… before try_files runs.
    location / {
        try_files $uri/index.html $uri =404;
    }
}
